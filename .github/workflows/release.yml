name: Publish APK Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare ASCII-named APKs
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$(find dist -maxdepth 1 -name '*.apk' ! -name '*-debug.apk' | head -1)" "out/${REPO}-${TAG}.apk"
          cp "$(find dist -maxdepth 1 -name '*-debug.apk' | head -1)" "out/${REPO}-${TAG}-debug.apk"
          ls -lh out

      - name: Create release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" out/*.apk \
            --title "$TAG" \
            --notes-file .github/release-notes.md \
            --verify-tag
